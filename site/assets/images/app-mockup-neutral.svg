    <text x="296" y="30" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#aeb5aa">מצב צפייה ברכב</text>
    <g transform="translate(0 66)">
      <rect width="296" height="312" rx="22" fill="#0f120f" stroke="#41493f"/>
      <g transform="translate(16 16)">
