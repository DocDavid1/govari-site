<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 960" role="img" aria-labelledby="title desc">
  <title id="title">מוקאפ ניטרלי של אפליקציית מצלמת הרכב</title>
  <desc id="desc">מסך טלפון כהה המציג ארבעה ערוצי מצלמה ומפה פשוטה ללא סצנות חריגות או טענות לא מאומתות.</desc>
  <defs>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1d1b"/><stop offset="1" stop-color="#070807"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#202520"/><stop offset="1" stop-color="#101310"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#323a34"/><stop offset="1" stop-color="#161b17"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="520" height="960" fill="none"/>
