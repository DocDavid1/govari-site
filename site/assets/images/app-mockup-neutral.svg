      <path d="M76 24 V174 M150 24 V174 M224 24 V174" stroke="#c9c1b2" stroke-width="2" opacity=".72"/>
      <circle cx="204" cy="72" r="11" fill="#171918"/><circle cx="204" cy="72" r="22" fill="#171918" opacity=".12"/>
      <text x="268" y="176" text-anchor="end" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#171918">מיקום ומסלול</text>
